name: Publish to Play Store

on:
  push:
    branches: [release]

# Builds a signed Android App Bundle (.aab) with the Play Store release
# keystore (separate from src/PiccoloReader/debug.keystore, which is only
# for internal sideload builds) and uploads it to the Play Console via the
# Play Developer API. See docs/play-store-release.md for the required
# secrets and the reasoning behind triggering only on pushes to `release`.
#
# Defaults to the "internal" track - a brand new app can't go straight to
# production until it clears Google's mandatory closed-testing period
# (12+ testers over 14 days). Promote through Play Console once eligible.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install maui-android

      # See build-apk.yml for why this is needed - restore for the
      # referenced Core project otherwise pulls in the maui-ios workload,
      # which isn't installed on this Linux runner.
      - name: Drop iOS target framework for this CI build
        run: sed -i 's#<TargetFrameworks>net10.0-android;net10.0-ios</TargetFrameworks>#<TargetFrameworks>net10.0-android</TargetFrameworks>#' src/PiccoloReader/PiccoloReader.csproj

      - name: Decode release keystore
        run: echo "${{ secrets.PLAY_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed Android App Bundle
        run: |
          dotnet publish src/PiccoloReader/PiccoloReader.csproj \
            -f net10.0-android -c Release \
            -p:AndroidPackageFormat=aab \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningKeyAlias=piccoloreader-release \
            -p:AndroidSigningStorePass="${{ secrets.PLAY_KEYSTORE_PASSWORD }}" \
            -p:AndroidSigningKeyPass="${{ secrets.PLAY_KEYSTORE_PASSWORD }}"

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fsoftt.piccoloreader
          releaseFiles: src/PiccoloReader/bin/Release/net10.0-android/*-Signed.aab
          track: internal
