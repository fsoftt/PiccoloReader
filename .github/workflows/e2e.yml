name: E2E (Android UI tests)

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/PiccoloReader.E2E/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [test/e2e-appium]
    paths:
      - 'src/**'
      - 'tests/PiccoloReader.E2E/**'
      - '.github/workflows/e2e.yml'

# Appium + UiAutomator2 tests (tests/PiccoloReader.E2E) driving the real APK on an
# x86_64 emulator. The APK must be self-contained and debuggable: the tests read the
# app's SQLite/preferences through `adb run-as` and wipe data with `pm clear`, neither
# of which works with a Fast Deployment Debug build or a non-debuggable Release build.
# So: Debug configuration with EmbedAssembliesIntoApk=true, signed with the repo's
# committed debug.keystore (see build-apk.yml for why).
#
# The push trigger on test/e2e-appium is only for iterating on this suite; it is
# harmless once the branch is merged/deleted.

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install Android workload
        run: dotnet workload install maui-android

      # See build-apk.yml: the ios TFM can't restore on Linux.
      - name: Drop iOS target framework for this CI build
        run: sed -i 's#<TargetFrameworks>net10.0-android;net10.0-ios</TargetFrameworks>#<TargetFrameworks>net10.0-android</TargetFrameworks>#' src/PiccoloReader/PiccoloReader.csproj

      - name: Build self-contained debuggable APK
        run: >
          dotnet build src/PiccoloReader/PiccoloReader.csproj -c Debug
          -p:EmbedAssembliesIntoApk=true -p:AndroidPackageFormat=apk

      - name: Locate APK
        run: |
          APK=$(ls src/PiccoloReader/bin/Debug/net10.0-android/*-Signed.apk | head -1)
          echo "PICCOLO_APK=$GITHUB_WORKSPACE/$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Build E2E tests
        run: dotnet build tests/PiccoloReader.E2E/PiccoloReader.E2E.csproj -c Release

      - name: Install Appium 2 + UiAutomator2 driver
        run: |
          npm install -g appium@2
          appium driver install uiautomator2@3.10.0
          appium --version

      # Emulator boot is the flakiest part of the job, so it gets a second attempt - but only
      # when the first one never reached the test run (marker file written by run-e2e.sh).
      - name: Run E2E tests on emulator (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tests/PiccoloReader.E2E/ci/run-e2e.sh

      - name: Run E2E tests on emulator (attempt 2, emulator failed to boot)
        id: attempt2
        if: steps.attempt1.outcome == 'failure' && hashFiles('e2e-started.marker') == ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          force-avd-creation: true
          script: bash tests/PiccoloReader.E2E/ci/run-e2e.sh

      - name: Upload screenshots, UI dumps and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-artifacts/**
            e2e-out/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail if the E2E run failed
        if: steps.attempt1.outcome != 'success' && steps.attempt2.outcome != 'success'
        run: |
          echo "::error::E2E tests failed (see the e2e-artifacts artifact)"
          exit 1
