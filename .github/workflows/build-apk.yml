name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'src/PiccoloReader/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

# Runs after a PR merges into main/master, so a downloadable APK is
# always available for the latest main. Signing uses the repo-committed
# src/PiccoloReader/debug.keystore (see PiccoloReader.csproj) rather than
# each runner's own auto-generated debug key, so this artifact can always
# be installed over a locally-built one instead of failing with
# INSTALL_FAILED_UPDATE_INCOMPATIBLE. This is for internal sideload
# testing only, not a Play Store release pipeline.
#
# Scoped to src/PiccoloReader/** (the app head - Views, Platforms,
# Resources) rather than the whole repo: changes confined to
# PiccoloReader.Core (ViewModels, Services, data model) have nothing
# to look at until a View actually uses them, so there's no reason to
# spend CI minutes producing an APK for those merges. workflow_dispatch
# still works regardless of what changed, for a manual build on demand.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install maui-android

      # iOS builds need Xcode/macOS, so the maui-ios workload can't be
      # installed on this Linux runner. The app project multi-targets
      # net10.0-android;net10.0-ios, and passing -f/-p:TargetFrameworks to
      # scope the build to Android alone still leaks into the restore graph
      # for the referenced Core project (it's a global MSBuild property).
      # Stripping the ios TFM from the csproj before building sidesteps
      # that entirely - restore then never needs the ios workload.
      - name: Drop iOS target framework for this CI build
        run: sed -i 's#<TargetFrameworks>net10.0-android;net10.0-ios</TargetFrameworks>#<TargetFrameworks>net10.0-android</TargetFrameworks>#' src/PiccoloReader/PiccoloReader.csproj

      - name: Build Release APK
        run: dotnet build src/PiccoloReader/PiccoloReader.csproj -c Release

      # Confirms the APK was actually signed with the repo-committed
      # debug.keystore rather than a runner-auto-generated fallback key.
      # A mismatch here means CI-built APKs will fail to install over
      # previous ones (Android rejects the signature mismatch) - fail
      # fast instead of finding out from a phone.
      - name: Verify APK is signed with the committed debug keystore
        run: |
          KEYSTORE_FINGERPRINT=$(keytool -list -v -keystore src/PiccoloReader/debug.keystore -storepass android -alias androiddebugkey \
            | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          APK_PATH=$(ls src/PiccoloReader/bin/Release/net10.0-android/*-Signed.apk)
          APK_FINGERPRINT=$(keytool -printcert -jarfile "$APK_PATH" \
            | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          echo "debug.keystore fingerprint: $KEYSTORE_FINGERPRINT"
          echo "Built APK fingerprint:      $APK_FINGERPRINT"
          if [ "$KEYSTORE_FINGERPRINT" != "$APK_FINGERPRINT" ]; then
            echo "::error::APK was not signed with src/PiccoloReader/debug.keystore - signing config was not applied as expected."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piccoloreader-apk-${{ github.sha }}
          path: src/PiccoloReader/bin/Release/net10.0-android/*-Signed.apk
          retention-days: 30
