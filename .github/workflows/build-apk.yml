name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Build Release APK
        run: dotnet build src/PiccoloReader/PiccoloReader.csproj -f net10.0-android -c Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piccoloreader-apk-${{ github.sha }}
          path: src/PiccoloReader/bin/Release/net10.0-android/*-Signed.apk
          retention-days: 30
