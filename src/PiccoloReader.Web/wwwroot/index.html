<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0E16" />
    <title>Piccolo Reader</title>
    <!-- "/" for local dev. The Pages workflow rewrites this to /PiccoloReader/app/ after publish. -->
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Piccolo" />
    <link rel="preload" href="fonts/MaterialSymbolsOutlined.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/tools.css" />
    <link rel="stylesheet" href="css/pwa.css" />
    <script>
        // GitHub Pages SPA fallback: 404.html stores the deep link here.
        (function () { var r = sessionStorage.redirect; delete sessionStorage.redirect; if (r && r !== location.href) history.replaceState(null, null, r); })();
    </script>
</head>
<body>
    <div id="app">
        <div class="splash">
            <div class="logo"><img src="piccolo-mark.svg" alt="" /></div>
            <div class="title">Piccolo</div>
            <div class="sub">Music Reader</div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
